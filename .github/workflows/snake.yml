  name: Generate Contribution Snake

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#d4af37&color_dots=#1c140e,#3e2723,#8c6239,#c5a059,#d4af37
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#d4af37&color_dots=#1c140e,#3e2723,#8c6239,#c5a059,#d4af37
            dist/github-contribution-grid-snake.gif?color_snake=#d4af37&color_dots=#1c140e,#3e2723,#8c6239,#c5a059,#d4af37

      - name: Push Snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
