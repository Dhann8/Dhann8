name: Tic Tac Toe Bot

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: startsWith(github.event.issue.title, 'ttc|')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Play Move
        run: |
          python scripts/tictactoe.py "${{ github.event.issue.title }}" "${{ github.event.issue.user.login }}"

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git commit -m "🎮 tic-tac-toe: move by @${{ github.event.issue.user.login }}"; then
            git push
          fi

      - name: Close Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --comment "Langkah kamu telah diproses! Papan di [README.md](https://github.com/${{ github.repository }}#readme) sudah diperbarui. Giliran selanjutnya silakan cek langsung di profil! 🎮"
